name: Validate bakery database schema

on:
  push:
    branches:
      - fullstack-setup
    paths:
      - "migrations/schema.sql"
      - ".github/workflows/check-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Check out setup branch
        uses: actions/checkout@v4
        with:
          ref: fullstack-setup
      - name: Validate schema and starter data using SQLite
        shell: bash
        run: |
          set -euo pipefail
          db="$(mktemp)"
          sqlite3 "$db" < migrations/schema.sql
          test "$(sqlite3 "$db" "SELECT COUNT(*) FROM products;")" -ge 6
          test "$(sqlite3 "$db" "SELECT COUNT(*) FROM app_settings WHERE setting_key='app';")" -eq 1
          for table in products app_settings orders login_attempts; do
            sqlite3 "$db" "SELECT 1 FROM $table LIMIT 1;" >/dev/null
          done
          echo "OK: schema applied; required tables and starter data verified."
          rm -f "$db"
