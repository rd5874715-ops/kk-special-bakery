name: Development branch checks

on:
  push:
    branches:
      - luxury-company-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  project-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run project checks
        run: npm run check
